{{ define "login.html" }}
{{ template "layout" . }}
{{ end }}

{{ define "content" }}
<div style="max-width: 420px; margin: 0 auto;">
    <span class="section-label">Account</span>
    <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;" id="auth-title">Sign In</h1>
    <p style="color: var(--muted); margin-bottom: 3rem;" id="auth-subtitle">Welcome back. Sign in to your account.</p>

    <div id="auth-error" style="display: none; background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; padding: 1rem; margin-bottom: 2rem; font-size: 0.85rem; border-radius: 4px;"></div>

    <div id="auth-reason" style="display: none; background: #ecfdf5; border: 1px solid #6ee7b7; color: #065f46; padding: 1.5rem; margin-bottom: 2rem; font-size: 0.85rem; border-radius: 4px; text-align: center;">
        <strong style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Your first run is ready.</strong>
        Create your account to view the strategy and copy the swarm has generated for you.
    </div>

    <form id="auth-form" onsubmit="handleAuth(event)" style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div>
            <label style="font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 0.5rem;">Email</label>
            <input type="email" id="auth-email" required
                   style="width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border); font-family: var(--font-sans); font-size: 0.9rem; outline: none; border-radius: 2px;"
                   placeholder="you@company.com">
        </div>
        <div>
            <label style="font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 0.5rem;">Password</label>
            <input type="password" id="auth-password" required minlength="6"
                   style="width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border); font-family: var(--font-sans); font-size: 0.9rem; outline: none; border-radius: 2px;"
                   placeholder="At least 6 characters">
        </div>
        <button type="submit" class="btn" id="auth-submit" style="width: 100%; text-align: center; cursor: pointer; border: none; font-family: var(--font-sans);">
            Sign In
        </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center;">
        <button onclick="handleGoogleSignIn()" style="width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border); background: white; cursor: pointer; font-family: var(--font-sans); font-size: 0.9rem; font-weight: 600; border-radius: 2px;">
            Continue with Google
        </button>
    </div>

    <p style="text-align: center; margin-top: 2rem; font-size: 0.85rem; color: var(--muted);">
        <span id="auth-toggle-text">Don't have an account?</span>
        <a href="#" id="auth-toggle" onclick="toggleMode(); return false;" style="color: var(--accent); text-decoration: none; font-weight: 600;">Create one</a>
    </p>
</div>

<script>
let isSignUp = false;

// Initialize from URL
const params = new URLSearchParams(window.location.search);
if (params.get('signup') === 'true') {
    isSignUp = true;
    setTimeout(() => {
        document.getElementById('auth-title').textContent = 'Create Account';
        document.getElementById('auth-subtitle').textContent = 'Start with 5 free runs per day. No card required.';
        document.getElementById('auth-submit').textContent = 'Create Account';
        document.getElementById('auth-toggle-text').textContent = 'Already have an account?';
        document.getElementById('auth-toggle').textContent = 'Sign in';
    }, 10);
}
if (params.get('reason') === 'view_results') {
    document.getElementById('auth-reason').style.display = 'block';
}

function toggleMode() {
    isSignUp = !isSignUp;
    document.getElementById('auth-title').textContent = isSignUp ? 'Create Account' : 'Sign In';
    document.getElementById('auth-subtitle').textContent = isSignUp
        ? 'Start with 5 free runs per day. No card required.'
        : 'Welcome back. Sign in to your account.';
    document.getElementById('auth-submit').textContent = isSignUp ? 'Create Account' : 'Sign In';
    document.getElementById('auth-toggle-text').textContent = isSignUp ? 'Already have an account?' : "Don't have an account?";
    document.getElementById('auth-toggle').textContent = isSignUp ? 'Sign in' : 'Create one';
    hideError();
}

function showError(msg) {
    const el = document.getElementById('auth-error');
    el.textContent = msg;
    el.style.display = 'block';
}

function hideError() {
    document.getElementById('auth-error').style.display = 'none';
}

function getRedirect() {
    const params = new URLSearchParams(window.location.search);
    return params.get('redirect') || '/dashboard';
}

async function handleAuth(e) {
    e.preventDefault();
    hideError();

    const email = document.getElementById('auth-email').value;
    const password = document.getElementById('auth-password').value;
    const btn = document.getElementById('auth-submit');
    btn.disabled = true;
    btn.textContent = isSignUp ? 'Creating...' : 'Signing in...';

    try {
        if (isSignUp) {
            await AgencyAuth.signUp(email, password);
        } else {
            await AgencyAuth.signIn(email, password);
        }
        window.location.href = getRedirect();
    } catch (err) {
        let msg = err.message || 'Authentication failed';
        if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
            msg = 'Invalid email or password.';
        } else if (err.code === 'auth/email-already-in-use') {
            msg = 'An account with this email already exists.';
        } else if (err.code === 'auth/weak-password') {
            msg = 'Password must be at least 6 characters.';
        } else if (err.code === 'auth/invalid-credential') {
            msg = 'Invalid email or password.';
        }
        showError(msg);
        btn.disabled = false;
        btn.textContent = isSignUp ? 'Create Account' : 'Sign In';
    }
}

async function handleGoogleSignIn() {
    hideError();
    try {
        await AgencyAuth.signInWithGoogle();
        window.location.href = getRedirect();
    } catch (err) {
        if (err.code !== 'auth/popup-closed-by-user') {
            showError(err.message || 'Google sign-in failed');
        }
    }
}

// If already signed in, redirect
AgencyAuth.onAuthStateChanged(function(user) {
    if (user) {
        window.location.href = getRedirect();
    }
});
</script>
{{ end }}
